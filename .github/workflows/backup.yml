name: Otomatik Veritabanı Yedeği

# Bu depo private olduğu için yedekler yalnızca bu depoya erişimi olan
# kişiler (siz) tarafından görülebilir. Başkası göremez.
#
# Her gün için tek bir klasör kullanılır (backups/TARIH/); gün içinde
# birden çok kez çalıştığında sadece veri gerçekten değiştiyse yeni bir
# commit oluşur (git diff kontrolü sayesinde). Hiçbir eski yedek SİLİNMEZ,
# git geçmişinde ve backups/ klasöründe kalıcı olarak birikir.

on:
  schedule:
    - cron: "*/5 * * * *" # Her 5 dakikada bir kontrol eder
  workflow_dispatch: {} # "Actions" sekmesinden elle de tetiklenebilir

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Supabase'den tüm tabloları indir
        env:
          SUPABASE_URL: https://oenfuqkakqfpfxptbsgz.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -e
          STAMP=$(date -u +%Y-%m-%d)
          DIR="backups/$STAMP"
          mkdir -p "$DIR"
          for TABLE in profiles records history stock_items stock_moves; do
            curl -sf "$SUPABASE_URL/rest/v1/$TABLE?select=*" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -o "$DIR/$TABLE.json"
          done

      - name: Değişiklik varsa depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "Otomatik yedek: $(date -u +"%Y-%m-%d %H:%M UTC")"
          git push
